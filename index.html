<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitter Bookmark Importer</title>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: #FAFAFA;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            width: 1440px;
            height: 800px;
            position: relative;
            background: #FAFAFA;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .title-section {
            margin-bottom: 20px;
        }
        .title-section span {
            font-family: 'Instrument Serif', serif;
            font-size: 64px;
            line-height: 76.80px;
            font-weight: 400;
        }
        .title-section .twitter-blue {
            color: #0BA5EC;
            font-style: italic;
        }
        .input-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 400px;
        }
        .input-label {
            color: #737373;
            font-size: 20px;
            line-height: 30px;
            font-weight: 400;
        }
        .input-wrapper {
            width: 100%;
            background: #E5E5E5;
            border-radius: 100px;
            padding: 16px 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .username-input {
            border: none;
            background: transparent;
            color: #292929;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            line-height: 24px;
            width: 100%;
            outline: none;
            text-align: center;
        }
        .username-input::placeholder {
            color: #A3A3A3;
        }
        .submit-button {
            background: #0BA5EC;
            color: white;
            padding: 16px 32px;
            border-radius: 100px;
            border: none;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s ease;
        }
        .submit-button:hover {
            background: #0981b8;
        }

        .bookmarks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            padding: 40px;
            width: 80%; /* Adjust as needed */
            max-width: 1200px; /* Adjust as needed */
            margin-top: 40px;
            margin-left: auto;
            margin-right: auto;
        }

        .bookmark-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            text-align: left;
            transition: transform 0.2s;
        }

        .bookmark-card:hover {
            transform: translateY(-5px);
        }

        .bookmark-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .bookmark-card-content {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .bookmark-card h3 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 18px;
            color: #292929;
            line-height: 1.4;
        }

        .bookmark-card p {
            font-size: 14px;
            color: #737373;
            line-height: 1.5;
            margin-bottom: 10px;
            flex-grow: 1;
        }

        .bookmark-card a {
            color: #0BA5EC;
            text-decoration: none;
            font-weight: 500;
            word-wrap: break-word;
        }

        .bookmark-card a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title-section">
            <span style="color: #292929;">Import your </span>
            <span class="twitter-blue">Twitter</span>
            <span style="color: #292929;"> bookmarks</span>
        </div>
        <div class="input-section">
            <div class="input-label">Add your twitter profile</div>
            <div class="input-wrapper">
                <input type="text" id="twitterUsername" class="username-input" placeholder="e.g. @johndoe">
            </div>
            <button id="fetchBookmarks" class="submit-button">Fetch Bookmarks</button>
        </div>

        <!-- New section for displaying bookmarks -->
        <div id="bookmarksGrid" class="bookmarks-grid"></div>

    </div>

    <script>
        // Simulated bookmark data
        const dummyBookmarks = [
            {
                id: '1',
                title: 'Understanding Async/Await in JavaScript',
                description: 'A comprehensive guide to JavaScript's async/await features, making asynchronous code easier to manage.',
                url: 'https://example.com/async-await',
                thumbnail: 'https://via.placeholder.com/300x180/E5E5E5/737373?text=Async/Await'
            },
            {
                id: '2',
                title: 'CSS Grid Layout: The Ultimate Guide',
                description: 'Master CSS Grid with this ultimate guide, covering everything from basic concepts to advanced techniques.',
                url: 'https://example.com/css-grid',
                thumbnail: 'https://via.placeholder.com/300x180/E5E5E5/737373?text=CSS+Grid'
            },
            {
                id: '3',
                title: 'React Hooks: A Deep Dive',
                description: 'Explore the power of React Hooks with practical examples and best practices for modern React development.',
                url: 'https://example.com/react-hooks',
                thumbnail: 'https://via.placeholder.com/300x180/E5E5E5/737373?text=React+Hooks'
            },
            {
                id: '4',
                title: 'Web Performance Optimization Tips',
                description: 'Boost your website's speed with these essential web performance optimization tips and tools.',
                url: 'https://example.com/web-perf',
                thumbnail: 'https://via.placeholder.com/300x180/E5E5E5/737373?text=Web+Perf'
            },
            {
                id: '5',
                title: 'Getting Started with Node.js and Express',
                description: 'Learn how to build robust web applications using Node.js and the Express framework.',
                url: 'https://example.com/nodejs-express',
                thumbnail: 'https://via.placeholder.com/300x180/E5E5E5/737373?text=Node.js'
            }
        ];

        function simulateFetchBookmarks(username) {
            return new Promise(resolve => {
                setTimeout(() => {
                    console.log(`Simulating fetch for @${username}`);
                    resolve(dummyBookmarks);
                }, 1500); // Simulate network delay
            });
        }

        function renderBookmarks(bookmarks) {
            const bookmarksGrid = document.getElementById('bookmarksGrid');
            bookmarksGrid.innerHTML = ''; // Clear previous bookmarks

            if (bookmarks.length === 0) {
                bookmarksGrid.innerHTML = '<p>No bookmarks found.</p>';
                return;
            }

            bookmarks.forEach(bookmark => {
                const card = document.createElement('div');
                card.classList.add('bookmark-card');

                card.innerHTML = `
                    ${bookmark.thumbnail ? `<img src="${bookmark.thumbnail}" alt="${bookmark.title}">` : ''}
                    <div class="bookmark-card-content">
                        <h3>${bookmark.title}</h3>
                        <p>${bookmark.description}</p>
                        <a href="${bookmark.url}" target="_blank" rel="noopener noreferrer">${bookmark.url}</a>
                    </div>
                `;
                bookmarksGrid.appendChild(card);
            });
        }

        document.getElementById('fetchBookmarks').addEventListener('click', async () => {
            const username = document.getElementById('twitterUsername').value.trim();
            if (username) {
                // Clear previous bookmarks and show a loading indicator
                const bookmarksGrid = document.getElementById('bookmarksGrid');
                bookmarksGrid.innerHTML = '<p>Loading bookmarks...</p>';

                try {
                    const bookmarks = await simulateFetchBookmarks(username);
                    renderBookmarks(bookmarks);
                } catch (error) {
                    bookmarksGrid.innerHTML = '<p style="color: red;">Error fetching bookmarks.</p>';
                    console.error('Error:', error);
                }
            } else {
                alert('Please enter your Twitter username.');
            }
        });
    </script>
</body>
</html>
